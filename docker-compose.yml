version: "3.9"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL – relational store for documents, audit logs and tenants
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: finSight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finSight
      POSTGRES_PASSWORD: finSightPass123!
      POSTGRES_DB: finsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # -------------------------------------------------------------------------
  # Redis – caching, pub/sub for real‑time UI updates and BullMQ fallback
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finSight-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # -------------------------------------------------------------------------
  # MinIO – S3‑compatible object storage (encrypted at rest in dev via SSE)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: finSight-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console

  # -------------------------------------------------------------------------
  # Ollama – local LLM for data enrichment (fallback to OpenAI in prod)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: finSight-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/version || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    # optional: preload a small model for dev
    # command: ["ollama", "run", "llama2"]

  # -------------------------------------------------------------------------
  # Google Cloud Tasks emulator – local task queue for OCR/LLM jobs
  # -------------------------------------------------------------------------
  cloudtasks:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: finSight-cloudtasks
    restart: unless-stopped
    command: >
      gcloud beta emulators tasks start
      --host-port=0.0.0.0:9090
      --project=finsight-dev
    environment:
      CLOUDSDK_CORE_PROJECT: finsight-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/_ah/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "9090:9090"

  # -------------------------------------------------------------------------
  # Go API – core REST service (Gin)
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: finSight-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      cloudtasks:
        condition: service_healthy
    environment:
      # Core services
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: finSight
      DB_PASSWORD: finSightPass123!
      DB_NAME: finsight
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      # Ollama (LLM) endpoint
      OLLAMA_ENDPOINT: http://ollama:11434
      # Cloud Tasks emulator
      TASKS_EMULATOR_HOST: cloudtasks:9090
      # JWT – for dev we use a static RSA key pair stored in a volume
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # Worker – background processor for OCR + LLM enrichment
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: finSight-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      cloudtasks:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: finSight
      DB_PASSWORD: finSightPass123!
      DB_NAME: finsight
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      OLLAMA_ENDPOINT: http://ollama:11434
      TASKS_EMULATOR_HOST: cloudtasks:9090
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
    secrets:
      - jwt_private_key
      - jwt_public_key
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # Frontend – Next.js UI
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: finSight-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8080   # placeholder for dev
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/_next/static/chunks/pages/_app.js || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # Cypress – end‑to‑end test runner (runs on `docker compose up test`)
  # -------------------------------------------------------------------------
  cypress:
    image: cypress/included:13.6.0
    container_name: finSight-cypress
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      cloudtasks:
        condition: service_healthy
    environment:
      CYPRESS_baseUrl: http://frontend:3000
      CYPRESS_apiUrl: http://api:8080
    working_dir: /e2e
    volumes:
      - .:/e2e
    command: ["cypress", "run", "--config", "baseUrl=http://frontend:3000"]
    # The Cypress container exits when tests finish; no healthcheck needed.

# ---------------------------------------------------------------------------
# Secrets – static RSA key pair for JWT signing (dev only)
# ---------------------------------------------------------------------------
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem

# ---------------------------------------------------------------------------
# Persistent volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
  redis-data:
  minio-data:
  # The JWT keys are mounted as secrets, not volumes.