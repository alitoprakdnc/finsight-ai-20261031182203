apiVersion: v2
name: finsight
description: Helm chart for deploying FinSight AI – a secure, multi‑tenant SaaS platform that automates OCR, LLM‑enhanced categorisation and bookkeeping of financial documents.
type: application
version: 1.0.0
appVersion: "1.2.3"
icon: https://raw.githubusercontent.com/yourorg/finsight-ai/main/docs/logo.png
home: https://github.com/yourorg/finsight-ai
sources:
  - https://github.com/yourorg/finsight-ai
keywords:
  - fintech
  - ocr
  - llm
  - accounting
  - saas
maintainers:
  - name: Jane Doe
    email: jane.doe@example.com
    url: https://github.com/janedoe
annotations:
  artifacthub.io/changes: |
    - Initial release with API, worker, and frontend components.
    - Integrated Google Cloud Secret Manager support.
    - Added Prometheus metrics and health‑check endpoints.
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: Jane Doe
      email: jane.doe@example.com
  artifacthub.io/prerelease: "false"
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - cache
  - name: minio
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
    tags:
      - storage
  - name: prometheus-node-exporter
    version: "4.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheusNodeExporter.enabled
    tags:
      - monitoring
  - name: kube-state-metrics
    version: "5.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kubeStateMetrics.enabled
    tags:
      - monitoring