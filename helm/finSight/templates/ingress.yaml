{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "finSight.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finSight.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "finSight.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "finSight.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.service.frontend.port }}
    {{- end }}
{{- end }}