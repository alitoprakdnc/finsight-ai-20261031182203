{{- if .Values.secretManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "finSight.fullname" . }}-gcp-spc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finSight.labels" . | nindent 4 }}
spec:
  provider: gcp
  parameters:
    secrets: |
{{- range .Values.secretManager.secrets }}
      - resourceName: "projects/{{ $.Values.secretManager.projectId }}/secrets/{{ .name }}/versions/{{ .version | default "latest" }}"
        fileName: "{{ .fileName | default .name }}"
{{- end }}
  secretObjects:
    - secretName: {{ include "finSight.fullname" . }}-gcp-secret
      type: Opaque
      data:
{{- range .Values.secretManager.secrets }}
        - objectName: "{{ .fileName | default .name }}"
          key: "{{ .key | default (upper .name) }}"
{{- end }}
{{- end }}